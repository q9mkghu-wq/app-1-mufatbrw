<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 꼬마 자동차 드라이브!</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #ui-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    color: white;
    font-size: 20px;
    font-weight: bold;
  }
  .score-box {
    background: #f39c12;
    border-radius: 20px;
    padding: 6px 16px;
    color: #1a1a2e;
    font-size: 18px;
    font-weight: bold;
  }
  .lives-box {
    font-size: 24px;
    letter-spacing: 4px;
  }
  #gameCanvas {
    display: block;
    border: 4px solid #f39c12;
    border-radius: 8px;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    color: white;
  }
  #overlay h1 {
    font-size: 52px;
    text-shadow: 3px 3px 0px #f39c12;
    margin-bottom: 10px;
  }
  #overlay p {
    font-size: 22px;
    margin: 8px 0;
    color: #f39c12;
  }
  #overlay .final-score {
    font-size: 38px;
    font-weight: bold;
    color: #2ecc71;
    margin: 10px 0;
  }
  #startBtn {
    margin-top: 20px;
    padding: 16px 48px;
    font-size: 26px;
    font-weight: bold;
    background: linear-gradient(135deg, #f39c12, #e74c3c);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(243,156,18,0.5);
    transition: transform 0.1s;
    font-family: inherit;
  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: scale(0.97); }
  #leaderboard {
    margin-top: 18px;
    width: 320px;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 12px 20px;
  }
  #leaderboard h3 {
    text-align: center;
    font-size: 20px;
    color: #f39c12;
    margin-bottom: 8px;
  }
  .lb-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { color: #f39c12; width: 28px; }
  .lb-name { flex: 1; }
  .lb-pts { color: #2ecc71; font-weight: bold; }
  #mobileControls {
    position: fixed;
    bottom: 10px;
    left: 0; right: 0;
    display: none;
    justify-content: space-around;
    padding: 0 20px;
    z-index: 100;
  }
  .ctrl-btn {
    width: 80px; height: 80px;
    background: rgba(243,156,18,0.7);
    border: 3px solid #f39c12;
    border-radius: 50%;
    font-size: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (max-width: 600px) {
    #mobileControls { display: flex; }
    #gameCanvas { width: 100vw; height: auto; }
  }
  #nameModal {
    position: fixed;
    top:0;left:0;right:0;bottom:0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  #nameModal .box {
    background: #1a1a2e;
    border: 3px solid #f39c12;
    border-radius: 20px;
    padding: 30px 40px;
    text-align: center;
    color: white;
  }
  #nameModal h2 { font-size: 28px; margin-bottom: 14px; }
  #nameInput {
    font-size: 22px;
    padding: 10px 18px;
    border-radius: 30px;
    border: 2px solid #f39c12;
    outline: none;
    background: #16213e;
    color: white;
    width: 200px;
    text-align: center;
    font-family: inherit;
  }
  #nameSubmit {
    display: block;
    margin: 14px auto 0;
    padding: 12px 36px;
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(135deg, #f39c12, #e74c3c);
    color: white;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="ui-top">
  <div class="score-box">⭐ 점수: <span id="scoreDisplay">0</span></div>
  <div>🚗 꼬마 드라이브</div>
  <div class="lives-box" id="livesDisplay">❤️❤️❤️</div>
</div>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<div id="mobileControls">
  <div class="ctrl-btn" id="btnLeft">⬅️</div>
  <div class="ctrl-btn" id="btnRight">➡️</div>
</div>

<div id="overlay">
  <h1>🚗 꼬마 드라이브!</h1>
  <p>🏆 방향키 or 화면 버튼으로 조종해요!</p>
  <p>🌟 동전을 모으고 장애물을 피하세요!</p>
  <button id="startBtn">게임 시작! 🎮</button>
  <div id="leaderboard">
    <h3>🏆 최고 기록</h3>
    <div id="lbList"><p style="text-align:center;color:#aaa">불러오는 중...</p></div>
  </div>
</div>

<div id="nameModal" style="display:none;">
  <div class="box">
    <h2>🎉 게임 오버!</h2>
    <p style="margin-bottom:12px;font-size:18px;color:#f39c12">이름을 입력하세요 😊</p>
    <input type="text" id="nameInput" maxlength="8" placeholder="이름 입력">
    <button id="nameSubmit">저장하기 💾</button>
  </div>
</div>

<script>
const firebaseConfig = {"apiKey":"AIzaSyAA9XxN-Pw0vbLT0f8-mI2bV0FgEx18iIU","authDomain":"appbuilder-4e83c.firebaseapp.com","projectId":"appbuilder-4e83c","storageBucket":"appbuilder-4e83c.firebasestorage.app","messagingSenderId":"1038242551917","appId":"1:1038242551917:web:4d59995638762401dd0764"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const W = 480, H = 640;
const ROAD_LEFT = 60, ROAD_RIGHT = 420;
const ROAD_W = ROAD_RIGHT - ROAD_LEFT;
const LANES = [100, 170, 240, 310, 380];

let score, lives, speed, running, frameCount;
let player, obstacles, coins, particles, roadLines;
let keys = {};
let lastTime = 0;
let pendingScore = 0;

// ===== PLAYER =====
function initGame() {
  score = 0;
  lives = 3;
  speed = 3;
  frameCount = 0;
  running = true;
  player = { x: W/2, y: H - 100, w: 38, h: 60, lane: 2, targetX: W/2 };
  obstacles = [];
  coins = [];
  particles = [];
  roadLines = [];
  for(let i=0; i<10; i++) roadLines.push({ y: i * 80, speed: speed });
  updateHUD();
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  let hearts = '';
  for(let i=0;i<3;i++) hearts += i < lives ? '❤️' : '🖤';
  document.getElementById('livesDisplay').textContent = hearts;
}

// ===== DRAW FUNCTIONS =====
function drawRoad() {
  // sky
  let sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, '#0f3460');
  sky.addColorStop(1, '#16213e');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // grass
  ctx.fillStyle = '#1a6b2a';
  ctx.fillRect(0,0,ROAD_LEFT,H);
  ctx.fillRect(ROAD_RIGHT,0,W-ROAD_RIGHT,H);

  // road
  ctx.fillStyle = '#555';
  ctx.fillRect(ROAD_LEFT,0,ROAD_W,H);

  // road edge lines
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 4;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(ROAD_LEFT,0); ctx.lineTo(ROAD_LEFT,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ROAD_RIGHT,0); ctx.lineTo(ROAD_RIGHT,H); ctx.stroke();

  // dashed lane lines
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([30,30]);
  for(let l of roadLines) {
    for(let i=1;i<5;i++) {
      let lx = ROAD_LEFT + i * (ROAD_W/5);
      ctx.beginPath(); ctx.moveTo(lx, l.y); ctx.lineTo(lx, l.y+50); ctx.stroke();
    }
  }
  ctx.setLineDash([]);
}

function drawCar(x, y, w, h, color, isPlayer) {
  ctx.save();
  ctx.translate(x - w/2, y - h/2);

  // body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(4, h*0.3, w-8, h*0.65, 6);
  ctx.fill();

  // top
  ctx.fillStyle = isPlayer ? '#ffe066' : lighten(color, 30);
  ctx.beginPath();
  ctx.roundRect(8, 6, w-16, h*0.45, 8);
  ctx.fill();

  // windows
  ctx.fillStyle = isPlayer ? 'rgba(100,200,255,0.8)' : 'rgba(200,230,255,0.5)';
  ctx.fillRect(10, 10, w-20, h*0.28);

  // wheels
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(6, h*0.42, 6, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w-6, h*0.42, 6, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, h*0.82, 6, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w-6, h*0.82, 6, 8, 0, 0, Math.PI*2); ctx.fill();

  if(isPlayer) {
    // headlights
    ctx.fillStyle = '#fff8a0';
    ctx.beginPath(); ctx.ellipse(8, h*0.1, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w-8, h*0.1, 5, 4, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function lighten(hex, pct) {
  try {
    let r = parseInt(hex.slice(1,3),16) + pct;
    let g = parseInt(hex.slice(3,5),16) + pct;
    let b = parseInt(hex.slice(5,7),16) + pct;
    r = Math.min(255,r); g = Math.min(255,g); b = Math.min(255,b);
    return `rgb(${r},${g},${b})`;
  } catch(e) { return hex; }
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  let pulse = 1 + 0.15 * Math.sin(frameCount * 0.1);
  ctx.scale(pulse, pulse);
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI*2);
  ctx.fillStyle = '#FFD700';
  ctx.fill();
  ctx.strokeStyle = '#FFA500';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#FFA500';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, 0);
  ctx.restore();
}

function drawParticles() {
  for(let p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ===== GAME LOGIC =====
function spawnObstacle() {
  let lane = LANES[Math.floor(Math.random() * LANES.length)];
  const colors = ['#e74c3c','#8e44ad','#16a085','#2980b9','#d35400'];
  obstacles.push({
    x: lane, y: -70, w: 38, h: 60,
    color: colors[Math.floor(Math.random()*colors.length)],
    speed: speed + Math.random()*1.5
  });
}

function spawnCoin() {
  let lane = LANES[Math.floor(Math.random() * LANES.length)];
  coins.push({ x: lane, y: -20, speed: speed * 0.8 });
}

function explode(x, y, color) {
  for(let i=0;i<18;i++) {
    let angle = Math.random() * Math.PI * 2;
    let spd = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r: 4 + Math.random()*6,
      color: color || '#f39c12',
      life: 40, maxLife: 40
    });
  }
}

function coinEffect(x, y) {
  for(let i=0;i<10;i++) {
    let angle = Math.random() * Math.PI * 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * 3,
      vy: Math.sin(angle) * 3,
      r: 3 + Math.random()*4,
      color: '#FFD700',
      life: 30, maxLife: 30
    });
  }
}

function checkCollision(a, b) {
  return Math.abs(a.x - b.x) < (a.w/2 + b.w/2 - 8) &&
         Math.abs(a.y - b.y) < (a.h/2 + b.h/2 - 8);
}

let invincibleTimer = 0;

function update(dt) {
  if(!running) return;
  frameCount++;

  // speed up over time
  speed = 3 + score * 0.005;

  // player movement
  let targetX;
  if(keys['ArrowLeft'] || keys['a']) {
    player.lane = Math.max(0, player.lane - 0.08);
  }
  if(keys['ArrowRight'] || keys['d']) {
    player.lane = Math.min(4, player.lane + 0.08);
  }
  let laneIdx = Math.round(player.lane);
  let laneX = LANES[Math.min(4, Math.max(0, laneIdx))];
  let rawX = ROAD_LEFT + (player.lane / 4) * ROAD_W;
  player.x += (rawX - player.x) * 0.15;

  // road lines
  for(let l of roadLines) {
    l.y += speed + 2;
    if(l.y > H) l.y -= 800;
  }

  // obstacles
  if(frameCount % Math.max(45, 80 - score/5) === 0) spawnObstacle();
  for(let i = obstacles.length-1; i>=0; i--) {
    let o = obstacles[i];
    o.y += o.speed;
    if(o.y > H + 80) { obstacles.splice(i,1); continue; }

    if(invincibleTimer <= 0 && checkCollision(player, o)) {
      explode(o.x, o.y, o.color);
      obstacles.splice(i,1);
      lives--;
      invincibleTimer = 90;
      updateHUD();
      if(lives <= 0) { endGame(); return; }
    }
  }

  // coins
  if(frameCount % 60 === 0) spawnCoin();
  for(let i = coins.length-1; i>=0; i--) {
    let c = coins[i];
    c.y += c.speed + 1;
    if(c.y > H + 30) { coins.splice(i,1); continue; }

    let dx = Math.abs(player.x - c.x);
    let dy = Math.abs(player.y - c.y);
    if(dx < 28 && dy < 36) {
      coinEffect(c.x, c.y);
      coins.splice(i,1);
      score += 10;
      updateHUD();
    }
  }

  // particles
  for(let i = particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.2;
    p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }

  if(invincibleTimer > 0) invincibleTimer--;

  // score by surviving
  if(frameCount % 30 === 0) { score++; updateHUD(); }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawRoad();

  // draw coins
  for(let c of coins) drawCoin(c);

  // draw obstacles
  for(let o of obstacles) drawCar(o.x, o.y, o.w, o.h, o.color, false);

  // draw player (blink if invincible)
  if(invincibleTimer <= 0 || Math.floor(invincibleTimer/6) % 2 === 0) {
    drawCar(player.x, player.y, player.w, player.h, '#f39c12', true);
  }

  drawParticles();

  // speed indicator
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(W - 50, H - 120, 16, 100);
  let spd = Math.min(1, (speed - 3) / 7);
  ctx.fillStyle = `hsl(${120 - spd*120},100%,50%)`;
  ctx.fillRect(W - 50, H - 120 + (1-spd)*100, 16, spd*100);
  ctx.fillStyle = 'white';
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('속도', W-42, H - 128);
}

function gameLoop(ts) {
  if(!running) return;
  let dt = ts - lastTime;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  initGame();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function endGame() {
  running = false;
  pendingScore = score;
  setTimeout(() => {
    document.getElementById('nameModal').style.display = 'flex';
  }, 600);
}

// ===== LEADERBOARD =====
function loadLeaderboard() {
  db.collection("apps/app-1-mufatbrw/items")
    .orderBy("score", "desc")
    .limit(5)
    .onSnapshot(snap => {
      let html = '';
      let i = 1;
      const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
      snap.forEach(doc => {
        let d = doc.data();
        html += `<div class="lb-item">
          <span class="lb-rank">${medals[i-1]}</span>
          <span class="lb-name">${d.name||'익명'}</span>
          <span class="lb-pts">${d.score}점</span>
        </div>`;
        i++;
      });
      if(html === '') html = '<p style="text-align:center;color:#aaa;font-size:14px">아직 기록이 없어요!</p>';
      document.getElementById('lbList').innerHTML = html;
    });
}

function saveScore(name, score) {
  db.collection("apps/app-1-mufatbrw/items").add({
    name: name,
    score: score,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    document.getElementById('nameModal').style.display = 'none';
    document.getElementById('overlay').style.display = 'flex';
  });
}

document.getElementById('nameSubmit').addEventListener('click', () => {
  let name = document.getElementById('nameInput').value.trim();
  if(!name) name = '꼬마운전자';
  saveScore(name, pendingScore);
  document.getElementById('nameInput').value = '';
});

document.getElementById('startBtn').addEventListener('click', startGame);

// keyboard
document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup', e => { keys[e.key] = false; });

// mobile
function mobileLeft(e) { e.preventDefault(); keys['ArrowLeft'] = true; }
function mobileRight(e) { e.preventDefault(); keys['ArrowRight'] = true; }
function mobileStop(e) { e.preventDefault(); keys['ArrowLeft'] = false; keys['ArrowRight'] = false; }

document.getElementById('btnLeft').addEventListener('touchstart', mobileLeft);
document.getElementById('btnLeft').addEventListener('touchend', mobileStop);
document.getElementById('btnRight').addEventListener('touchstart', mobileRight);
document.getElementById('btnRight').addEventListener('touchend', mobileStop);
document.getElementById('btnLeft').addEventListener('mousedown', mobileLeft);
document.getElementById('btnLeft').addEventListener('mouseup', mobileStop);
document.getElementById('btnRight').addEventListener('mousedown', mobileRight);
document.getElementById('btnRight').addEventListener('mouseup', mobileStop);

// Canvas resize for mobile
function resizeCanvas() {
  let vw = window.innerWidth;
  let vh = window.innerHeight - 60;
  let ratio = W / H;
  let cw, ch;
  if(vw / vh < ratio) { cw = vw; ch = vw / ratio; }
  else { ch = vh; cw = vh * ratio; }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

loadLeaderboard();
</script>
</body>
</html>
